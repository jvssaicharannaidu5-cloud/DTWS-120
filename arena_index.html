    function Icon({ d, size = 16, className = '' }) {
      return (
        <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.75" strokeLinecap="round" strokeLinejoin="round" className={className}>

    }

    function Sparkline({ data, color = '#2ee6c7', w = 72, h = 22 }) {
      const max = Math.max(...data), min = Math.min(...data);
      const pts = data.map((v, i) => {
        const x = (i / (data.length - 1)) * w;
        const y = h - ((v - min) / (max - min || 1)) * (h - 2) - 1;
        return `${x},${y}`;
      }).join(' ');
      return (
        <svg width={w} height={h} className="block">
          <polyline fill="none" stroke={color} strokeWidth="1.4" points={pts} />
        </svg>
      );
    }

    function LineChart({ series, labels, height = 150, colors }) {
      const w = 640, h = height, pad = { l: 36, r: 10, t: 12, b: 22 };
      const all = series.flatMap(s => s.data);
      const max = Math.max(...all) * 1.08;
      const min = Math.min(0, Math.min(...all));
      const iw = w - pad.l - pad.r, ih = h - pad.t - pad.b;
      const x = i => pad.l + (i / (labels.length - 1)) * iw;
      const y = v => pad.t + ih - ((v - min) / (max - min || 1)) * ih;
      const grid = [0, 0.25, 0.5, 0.75, 1];
      return (
        <svg viewBox={`0 0 ${w} ${h}`} className="w-full h-full">
          {grid.map((g, i) => (
            <g key={i}>
              <line x1={pad.l} x2={w - pad.r} y1={pad.t + ih * (1 - g)} y2={pad.t + ih * (1 - g)} stroke="#243040" strokeWidth="1" />
              <text x={pad.l - 6} y={pad.t + ih * (1 - g) + 3} textAnchor="end" fill="#6b7c90" fontSize="9" fontFamily="IBM Plex Mono">{fmt(min + (max - min) * g, 0)}</text>
            </g>
          ))}
          {series.map((s, si) => {
            const d = s.data.map((v, i) => `${i === 0 ? 'M' : 'L'}${x(i)},${y(v)}`).join(' ');
            const area = `${d} L${x(s.data.length - 1)},${y(0)} L${x(0)},${y(0)} Z`;
            return (
              <g key={si}>
                {s.fill && <path d={area} fill={colors[si]} opacity="0.12" />}
                <path d={d} fill="none" stroke={colors[si]} strokeWidth="1.6" />
              </g>
            );
          })}
          {labels.map((lb, i) => i % 3 === 0 ? (
            <text key={i} x={x(i)} y={h - 6} textAnchor="middle" fill="#6b7c90" fontSize="9" fontFamily="IBM Plex Mono">{lb}</text>
          ) : null)}
        </svg>
      );

    function DynoCard({ well }) {
      const pts = useMemo(() => {
        const a = [];
        const fill = (well.fillage || 80) / 100;
        for (let i = 0; i <= 80; i++) {
          const t = i / 80;
          const pos = t * 144;
          let load;
          if (t < 0.5) {
            const u = t / 0.5;
            load = 8.2 + 14 * Math.min(1, u / 0.18) - (u > fill ? 9 * ((u - fill) / (1 - fill + 0.01)) : 0);
          } else {
            const u = (t - 0.5) / 0.5;
            load = 6.4 - 2.8 * u + Math.sin(u * 8) * 0.25;
          }
          if (well.status === 'critical') load += Math.sin(t * 40) * 1.8;
          a.push([pos, load]);
        }
        return a;
      }, [well]);
      const w = 420, h = 168, pad = { l: 40, r: 12, t: 12, b: 24 };
      const maxL = 26, minL = 0;
      const x = p => pad.l + (p / 144) * (w - pad.l - pad.r);
      const y = l => pad.t + (1 - (l - minL) / (maxL - minL)) * (h - pad.t - pad.b);
      const d = pts.map((p, i) => `${i ? 'L' : 'M'}${x(p[0])},${y(p[1])}`).join(' ') + ' Z';
      return (
        <svg viewBox={`0 0 ${w} ${h}`} className="w-full h-full">
          {[0, 0.25, 0.5, 0.75, 1].map((g, i) => (

              <line x1={pad.l} x2={w - pad.r} y1={pad.t + (h - pad.t - pad.b) * (1 - g)} y2={pad.t + (h - pad.t - pad.b) * (1 - g)} stroke="#243040" />

            </g>
          ))}

          <text x={w / 2} y={h - 4} textAnchor="middle" fill="#6b7c90" fontSize="9" fontFamily="IBM Plex Mono">POSITION (in) · SURFACE DYNAMOMETER</text>
          <text x={12} y={14} fill="#6b7c90" fontSize="9" fontFamily="IBM Plex Mono" transform="rotate(-90 12 80)">LOAD (klbf)</text>
        </svg>
      );

    function DigitalTwin({ well, view, onReady }) {
      const wrapRef = useRef(null);
      const labelsRef = useRef(null);
      const wellRef = useRef(well);
      wellRef.current = well;

      useEffect(() => {
        if (view !== '3d' || !wrapRef.current || typeof THREE === 'undefined') return;
        const el = wrapRef.current;
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x0a1016);
        scene.fog = new THREE.Fog(0x0a1016, 28, 90);

        const camera = new THREE.PerspectiveCamera(42, 1, 0.1, 200);
        camera.position.set(14, 10, 16);

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = true;
        el.appendChild(renderer.domElement);
        renderer.domElement.className = 'twin-canvas';

        const hemi = new THREE.HemisphereLight(0x9bb8c9, 0x3a2a18, 0.55);
        scene.add(hemi);
        const sun = new THREE.DirectionalLight(0xffe6c2, 0.85);
        sun.position.set(20, 30, 10);
        sun.castShadow = true;
        scene.add(sun);
        const teal = new THREE.PointLight(0x2ee6c7, 1.4, 28);
        teal.position.set(2, 4, 2);
        scene.add(teal);
        const amber = new THREE.PointLight(0xf5a623, 1.1, 22);
        amber.position.set(-4, 3, -2);
        scene.add(amber);

        const ground = new THREE.Mesh(
          new THREE.CircleGeometry(40, 48),
          new THREE.MeshStandardMaterial({ color: 0x2a241c, roughness: 0.95, metalness: 0.05 })
        );
        ground.rotation.x = -Math.PI / 2;
        ground.receiveShadow = true;
        scene.add(ground);

        const grid = new THREE.GridHelper(40, 40, 0x3a4a3a, 0x243018);
        grid.position.y = 0.02;
        scene.add(grid);

        const pad = new THREE.Mesh(
          new THREE.BoxGeometry(16, 0.18, 12),
          new THREE.MeshStandardMaterial({ color: 0x4a4e52, roughness: 0.8 })
        );
        pad.position.y = 0.1;
        scene.add(pad);

        const matSteel = new THREE.MeshStandardMaterial({ color: 0x8a93a0, metalness: 0.72, roughness: 0.32 });
        const matDark = new THREE.MeshStandardMaterial({ color: 0x2c333c, metalness: 0.5, roughness: 0.4 });
        const matTeal = new THREE.MeshStandardMaterial({ color: 0x1a6b62, emissive: 0x0b3, emissiveIntensity: 0.35, metalness: 0.4, roughness: 0.4 });
        const matSteam = new THREE.MeshStandardMaterial({ color: 0x8a4a20, emissive: 0xf5a623, emissiveIntensity: 0.25, metalness: 0.3, roughness: 0.5 });
        const matWarn = new THREE.MeshStandardMaterial({ color: 0xcc3344, emissive: 0xf43f5e, emissiveIntensity: 0.4 });

        function cyl(r, h, mat, x, y, z, rx = 0, rz = 0) {
          const m = new THREE.Mesh(new THREE.CylinderGeometry(r, r, h, 16), mat);
          m.position.set(x, y, z);
          m.rotation.x = rx; m.rotation.z = rz;
          m.castShadow = true;
          scene.add(m);
          return m;
        }
        function box(w, h, d, mat, x, y, z) {
          const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat);
          m.position.set(x, y, z);
          m.castShadow = true;
          scene.add(m);

        box(3.2, 0.5, 3.2, matDark, 0, 0.4, 0);

          wellhead: new THREE.Vector3(0, 4.6, 0),

          flow: new THREE.Vector3(3.5, 1.8, 1.6),
          rtu: new THREE.Vector3(-5.4, 2.6, 2.2)
        };

        let mx = 0, my = 0, dragging = false, ax = 0.42, ay = 0.38, dist = 22;
        const onDown = e => { dragging = true; mx = e.clientX; my = e.clientY; };
        const onUp = () => { dragging = false; };
        const onMove = e => {
          if (!dragging) return;
          ax -= (e.clientX - mx) * 0.005;
          ay = clamp(ay + (e.clientY - my) * 0.005, 0.12, 1.2);
          mx = e.clientX; my = e.clientY;
        };
        const onWheel = e => { e.preventDefault(); dist = clamp(dist + e.deltaY * 0.02, 10, 40); };
        el.addEventListener('pointerdown', onDown);
        window.addEventListener('pointerup', onUp);
        window.addEventListener('pointermove', onMove);
        el.addEventListener('wheel', onWheel, { passive: false });

        const labelEls = {};
        const labRoot = labelsRef.current;
        ['wellhead', 'pump', 'steam', 'flow', 'rtu'].forEach(k => {
          const d = document.createElement('div');
          d.className = 'label-chip';
          labRoot.appendChild(d);
          labelEls[k] = d;
        });

        const clock = new THREE.Clock();
        let raf;
        const resize = () => {
          const w = el.clientWidth, h = el.clientHeight || 320;
          camera.aspect = w / Math.max(h, 1);
          camera.updateProjectionMatrix();
          renderer.setSize(w, h, false);
        };
        const ro = new ResizeObserver(resize);
        ro.observe(el);
        resize();

        const animate = () => {
          raf = requestAnimationFrame(animate);
          const t = clock.getElapsedTime();
          const wdat = wellRef.current;
          const spm = wdat.spm || 0;
          const nod = Math.sin(t * (spm * 0.45 + 0.4)) * 0.22;
          beam.rotation.z = nod;
          beam.position.y = 4.55 + Math.sin(t * 2) * 0.02;
          horse.position.y = 4.35 + nod * 4;
          polish.position.y = 2.2 + nod * 1.6;
          crank.rotation.z = t * (spm * 0.6 + 0.5);
          beacon.material.emissiveIntensity = 0.4 + Math.sin(t * 6) * 0.4;
          teal.intensity = 1.1 + Math.sin(t * 2) * 0.3;

          flow.forEach((p, i) => {
            const u = (t * 0.35 + i / 18) % 1;
            p.position.set(-1 + u * 8, 1.35 + Math.sin(u * 6) * 0.05, 1.6);
            p.visible = wdat.rate > 1;
          });
          steamP.forEach((p, i) => {
            const u = (t * 0.25 + i / 10) % 1;
            p.position.set(-5 + u * 5, 1.55 + Math.sin(u * 8) * 0.08, -1.4);
            p.visible = wdat.steam > 10 || wdat.cycle === 'INJECT';
          });

          camera.position.x = Math.cos(ax) * dist * Math.cos(ay);
          camera.position.z = Math.sin(ax) * dist * Math.cos(ay);
          camera.position.y = 4 + Math.sin(ay) * dist;
          camera.lookAt(1.5, 2.2, 0);

          renderer.render(scene, camera);

          const rect = el.getBoundingClientRect();
          Object.entries(anchors).forEach(([k, vec]) => {
            const v = vec.clone().project(camera);
            const x = (v.x * 0.5 + 0.5) * rect.width;
            const y = (-v.y * 0.5 + 0.5) * rect.height;
            const eln = labelEls[k];
            if (!eln) return;
            if (v.z > 1) { eln.style.display = 'none'; return; }
            eln.style.display = 'block';
            eln.style.left = x + 'px';
            eln.style.top = y + 'px';
          });
          labelEls.wellhead.innerHTML = `X-TREE <span>${wdat.id}</span> · THP ${fmt(wdat.thp, 0)} psi`;
          labelEls.pump.innerHTML = `BEAM PUMP · ${fmt(wdat.spm, 1)} SPM · η ${fmt(wdat.pumpEff, 0)}%`;
          labelEls.steam.innerHTML = `STEAM HDR · ${wdat.steam > 0 ? fmt(wdat.steam, 0) + ' CWE bbl/d' : wdat.cycle}`;
          labelEls.flow.innerHTML = `FLOWLINE 3" · ${fmt(wdat.rate, 1)} bbl/d`;
          labelEls.rtu.innerHTML = `RTU / SCADA · LIVE`;
        };
        animate();
        if (onReady) onReady();

        return () => {
          cancelAnimationFrame(raf);
          ro.disconnect();
          el.removeEventListener('pointerdown', onDown);
          window.removeEventListener('pointerup', onUp);
          window.removeEventListener('pointermove', onMove);
          el.removeEventListener('wheel', onWheel);
          renderer.dispose();
          if (renderer.domElement.parentNode) renderer.domElement.parentNode.removeChild(renderer.domElement);
          labRoot.innerHTML = '';
        };
      }, [view]);

      return (
        <div className="relative w-full h-full min-h-[280px] bg-[#0a1016] overflow-hidden">
          {view === '3d' ? (
            <>
              <div ref={wrapRef} className="absolute inset-0" />
              <div ref={labelsRef} className="absolute inset-0 pointer-events-none" />
            </>
          ) : (
            <Schematic well={well} />
          )}
          <div className="absolute left-2 bottom-2 text-[9px] font-mono text-slate-500 pointer-events-none">
            BAGHEWALA · SURFACE TWIN · {well.pad} · {well.id} · DRAG ORBIT · SCROLL ZOOM
          </div>
        </div>
      );
    }
